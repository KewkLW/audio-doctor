# RME ADI-2 Pro: always use Pro Audio (raw AUX channels, no surround remixing).
# Stereo devices on top of it come from ~/.config/pipewire/pipewire.conf.d/50-rme-adi2-stereo.conf
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-RME_ADI-2_Pro.*" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
  {
    matches = [ { node.name = "~alsa_(output|input).usb-RME_ADI-2_Pro.*" } ]
    actions = { update-props = {
      session.suspend-timeout-seconds = 0   # no pop/relock when audio starts
      api.alsa.headroom = 0
    } }
  }
]
